[project]
name = "chaosflow"
version = "0.1.0"
description = "ChaosFlow: configurable, resilient data-pipeline platform (engine + REST API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "coverage>=7",
  "ruff>=0.5",
  "mypy>=1.10",
  "websockets>=12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
  "E501", # line length is enforced by review, not the linter
  "B008", # FastAPI Depends()/Query() in defaults is the framework idiom
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.alembic]
script_location = "alembic"
